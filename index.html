<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Pomofocus ile görevlerini düzenle ve odaklanma sürelerini takip et."
    >

    <title>Pomodoro Timer Online</title>

    <link rel="stylesheet" href="./style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    >
    <script type="module" src="./main.js"></script>

</head>

<body>
    <header class="page-header">
        <h1 class="brand">Pomofocus</h1>

        <nav class="header-actions" aria-label="Ana menü">
            <button type="button">Report</button>
            <button type="button">Settings</button>
            <button type="button">Sign In</button>
            <button type="button" aria-label="Diğer seçenekler">⋮</button>
        </nav>
    </header>

    <main class="page-main">
        <section class="timer-card" aria-label="Pomodoro zamanlayıcısı">
            <div class="timer-modes" aria-label="Zamanlayıcı modu">
                <button id="btnPomodoro" type="button" aria-pressed="true">Pomodoro</button>
                <button id="btnShortbreak" type="button" aria-pressed="false">Short break</button>
                <button id="btnLongbreak" type="button" aria-pressed="false">Long break</button>
            </div>

            <p  id="pRemainTime" class="timer-display" role="timer" aria-label="Kalan süre">
                25:00
            </p>

            <button id="btnStart"  class="start-button" type="button">
                Start
            </button>
        </section>

        <section class="session-info" aria-label="Mevcut oturum">
            <p id ="pSessionnumber" class="session-number">#1</p>
            <p id ="pSessionLabel" class="session-label">Time to Focus!</p>
        </section>

        <section class="tasks" aria-labelledby="tasks-title">
            <header class="tasks-header">
                <h2 class="tasks-title" id="tasks-title">Tasks</h2>

                <button
                    class="menu-button"
                    type="button"
                    aria-label="Görev seçenekleri"
                >
                    ⋮
                </button>
            </header>
            <div id="divTaskList">
            </div>

            <button class="add-task" type="button">
                <i class="fa fa-plus-circle" aria-hidden="true"></i>
                <span>Add item</span>
            </button>
        </section>

        <footer class="session-summary">
            <div>
                <span class="summary-label">Pomos</span>
                <span class="summary-value">1/1</span>
            </div>

            <div>
                <span class="summary-label">Finish At</span>
                <span class="summary-value">00:00</span>
            </div>
        </footer>
    </main>
</body>
</html>
